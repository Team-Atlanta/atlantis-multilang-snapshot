version: '3.8'

# DinD MLLA mode: redis + codeindexer + joern + lsp + crs
# No cleanup sidecar needed - when outer container stops, all nested containers die
# Use this when CRS_INPUT_GENS includes mlla or testlang_input_gen
#
# IMPORTANT: Volume mounts use CONTAINER paths (e.g., /artifacts, /out), NOT host paths.
# In DinD mode, the nested Docker daemon runs inside the outer container and shares
# its filesystem, so container paths like /artifacts/tarballs are directly accessible.
# This is different from host_docker_builder mode which requires HOST_* paths.

services:
  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - crs-network

  codeindexer:
    image: crs-multilang:latest
    environment:
      - PYTHONUNBUFFERED=1
      - TARBALL_DIR=/tarballs
      - CODE_INDEXER_REDIS_URL=redis://redis:6379
    volumes:
      - /artifacts/tarballs:/tarballs:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      - crs-network
    command: ["init_codeindexer"]
    restart: "no"

  joern:
    image: multilang-runner-joern:latest
    volumes:
      - /artifacts/tarballs:/tarballs:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      - crs-network

  lsp:
    image: multilang-lsp-${CRS_TARGET}:latest
    environment:
      - TARBALL_DIR=/tarballs
      - CRS_TARGET=${CRS_TARGET:-}
    volumes:
      - /artifacts/tarballs:/tarballs:ro
    depends_on:
      redis:
        condition: service_started
    networks:
      - crs-network
    ports:
      - "3303"

  crs:
    image: crs-multilang:latest
    privileged: true
    stop_grace_period: 30s
    environment:
      - PYTHONUNBUFFERED=1
      - TARBALL_DIR=/tarballs
      - CRS_CONFIG=/crs.config
      - LITELLM_URL=${LITELLM_URL:-}
      - LITELLM_KEY=${LITELLM_KEY:-}
      - CPUSET_CPUS=${CPUSET_CPUS:-0-7}
      - FUZZING_ENGINE=${FUZZING_ENGINE:-libfuzzer}
      - SANITIZER=${SANITIZER:-address}
      - RUN_FUZZER_MODE=${RUN_FUZZER_MODE:-interactive}
      - HELPER=True
      - CRS_INTERACTIVE=True
      - CRS_TARGET=${CRS_TARGET:-}
      - SEED_SHARE_DIR=/seed_share_dir
      - CRS_NAME=${CRS_NAME:-crs-multilang}
      - CRS_SKIP_SAVE=${CRS_SKIP_SAVE:-}
      - DICTGEN_REDIS_URL=redis://redis:6379
      - CODE_INDEXER_REDIS_URL=redis://redis:6379
      - JOERN_URL=http://joern:9909
      - LSP_SERVER_URL=http://lsp:3303
      # Real-time output to mounted /artifacts/ directory
      - CRS_POV_DIR=/artifacts/povs
      - CRS_CORPUS_DIR=/artifacts/corpus
    # Volume mounts use DinD container paths (not HOST_* paths)
    # These paths exist in the outer DinD container's filesystem
    volumes:
      - /artifacts/tarballs:/tarballs:ro  # DinD's /artifacts/tarballs → nested /tarballs
      - /out:/out                          # DinD's /out → nested /out
      - /artifacts:/artifacts              # DinD's /artifacts → nested /artifacts
      # Per-harness artifact overlays (oss-crs mounts these to DinD container)
      - /artifacts/povs:/artifacts/povs
      - /artifacts/corpus:/artifacts/corpus
      - /artifacts/crs-data:/artifacts/crs-data
      - /tmp/crs.config:/crs.config:ro
    depends_on:
      codeindexer:
        condition: service_completed_successfully
      joern:
        condition: service_started
      lsp:
        condition: service_started
    networks:
      - crs-network
    command: ["run_crs"]

networks:
  crs-network:
    driver: bridge
