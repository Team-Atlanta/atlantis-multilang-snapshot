version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis_${SAFE_TARGET}_${SAFE_HARNESS}
    command: redis-server --appendonly yes
    restart: unless-stopped
    cpuset: ${CPUSET_CPUS:-0-7}
    networks:
      - crs-internal

  joern:
    image: crs-multilang/multilang-runner-joern:latest
    container_name: joern_${SAFE_TARGET}_${SAFE_HARNESS}
    cpuset: ${CPUSET_CPUS:-0-7}
    profiles: ["others"]
    volumes:
      - ${HOST_ARTIFACT_DIR:-/out}/tarballs:/tarballs:ro
    depends_on:
      - redis
    networks:
      - crs-internal

  codeindexer:
    image: crs-multilang/crs-multilang:latest
    container_name: codeindexer_${SAFE_TARGET}_${SAFE_HARNESS}
    cpuset: ${CPUSET_CPUS:-0-7}
    profiles: ["others"]
    environment:
      - PYTHONUNBUFFERED=1
      - TARBALL_DIR=/tarballs
      - CODE_INDEXER_REDIS_URL=redis://redis:6379
    volumes:
      - ${HOST_ARTIFACT_DIR:-/out}/tarballs:/tarballs:ro
    depends_on:
      - redis
    networks:
      - crs-internal
    command: ["init_codeindexer"]
    # Exit after indexing is complete (not a long-running service)
    restart: "no"

  lsp:
    image: ${LSP_RUNNER:-crs-multilang/multilang-lsp-base:latest}
    container_name: lsp_${SAFE_TARGET}_${SAFE_HARNESS}
    restart: unless-stopped
    cpuset: ${CPUSET_CPUS:-0-7}
    profiles: ["others"]
    environment:
      - CRS_TARGET=${CRS_TARGET:-}
    volumes:
      - ${HOST_ARTIFACT_DIR:-/out}/tarballs:/tarballs:ro
    depends_on:
      - redis
    networks:
      - crs-internal
    ports:
      - "3303"  # Expose internally, mapped dynamically

  crs:
    image: crs-multilang/crs-multilang:latest
    container_name: crs_${SAFE_TARGET}_${SAFE_HARNESS}
    privileged: true
    cpuset: ${CPUSET_CPUS:-0-7}
    mem_limit: ${MEMORY_LIMIT:-16G}
    environment:
      - PYTHONUNBUFFERED=1
      - TARBALL_DIR=/tarballs
      - CRS_CONFIG=/crs.config
      - LITELLM_URL=${LITELLM_URL:-}
      - LITELLM_KEY=${LITELLM_KEY:-}
      - CPUSET_CPUS=${CPUSET_CPUS:-0-7}
      - FUZZING_ENGINE=${FUZZING_ENGINE:-libfuzzer}
      - SANITIZER=${SANITIZER:-address}
      - RUN_FUZZER_MODE=${RUN_FUZZER_MODE:-interactive}
      - HELPER=True
      - CRS_INTERACTIVE=True
      - CRS_TARGET=${CRS_TARGET:-}
      - SEED_SHARE_DIR=/seed_share_dir
      - CRS_NAME=${CRS_NAME:-crs-multilang}
      - CRS_SKIP_SAVE=${CRS_SKIP_SAVE:-}
      # Use service names - they resolve on crs-internal network (project-scoped)
      - CODE_INDEXER_REDIS_URL=redis://redis:6379
      - DICTGEN_REDIS_URL=redis://redis:6379
      - JOERN_URL=http://joern:9909
      - LSP_SERVER_URL=http://lsp:3303
    volumes:
      - ${HOST_ARTIFACT_DIR:-/out}/tarballs:/tarballs:ro
      - ${HOST_ARTIFACT_DIR:-/out}:/artifacts
      - ${HOST_OUT_DIR:-/out}:/out
      - ${HOST_CRS_CONFIG:-/tmp/crs.config}:/crs.config:ro
    depends_on:
      - redis
    # Note: No depends_on for optional services (profile: others)
    networks:
      # Internal network for redis/joern communication (project-scoped, isolated)
      - crs-internal
      # External network for LiteLLM connectivity (optional, shared)
      - crs-external
    command: ["run_crs"]

  # Cleanup sidecar: monitors runner container and stops all services when runner exits
  # This ensures containers are cleaned up even if runner is killed externally
  cleanup:
    image: docker:cli
    container_name: cleanup_${SAFE_TARGET}_${SAFE_HARNESS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - RUNNER_CONTAINER_ID=${RUNNER_CONTAINER_ID:-}
      - COMPOSE_PROJECT_NAME
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Cleanup sidecar started, monitoring runner: $RUNNER_CONTAINER_ID"
        if [ -z "$RUNNER_CONTAINER_ID" ]; then
          echo "WARNING: RUNNER_CONTAINER_ID not set, cleanup disabled"
          sleep infinity
        fi
        docker wait $RUNNER_CONTAINER_ID || true
        echo "Runner exited, stopping all services..."
        # Use longer timeout (30s) to allow crs to save results before SIGKILL
        docker ps -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" | xargs -r docker stop -t 30
    restart: "no"

networks:
  # Internal network: Always created, project-scoped, isolated per project/harness
  # Service names (redis, joern) resolve within this network without collision
  crs-internal:
    driver: bridge

  # External network: For LiteLLM connectivity
  # Only CRS joins this network to reach LiteLLM
  crs-external:
    name: ${CRS_EXTERNAL_NETWORK:-crs-multilang-network}
    external: ${CRS_NETWORK_EXTERNAL:-false}
